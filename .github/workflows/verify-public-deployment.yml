name: Verify Public Deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public dashboard base URL"
        required: false
        default: "https://stock.letslepai.com"
      expected_commit:
        description: "Expected deployed commit. Leave blank to use this workflow commit."
        required: false
        default: ""
      advisor_symbol:
        description: "TW symbol(s) for /tw/advisor API smoke test, e.g. 6919 or 6919,2886,8150,3711."
        required: false
        default: "6919,2886,8150,3711"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public deployment
        run: |
          set -euo pipefail
          expected="${{ github.event.inputs.expected_commit }}"
          if [ -z "$expected" ]; then
            expected="${GITHUB_SHA}"
          fi
          failures=0
          python3 scripts/verify_public_deployment.py \
            --base-url "${{ github.event.inputs.base_url }}" \
            --expected-commit "$expected" \
            --advisor-symbol "${{ github.event.inputs.advisor_symbol }}" \
            --timeout 20 | tee public-deployment-verification.txt || failures=$?
          python3 scripts/check_operational_health.py \
            --base-url "${{ github.event.inputs.base_url }}" \
            --timeout 20 \
            --json > public-operational-health.json || true
          exit "$failures"

      - name: Upload public deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-deployment-diagnostics
          path: |
            public-deployment-verification.txt
            public-operational-health.json
          if-no-files-found: ignore
