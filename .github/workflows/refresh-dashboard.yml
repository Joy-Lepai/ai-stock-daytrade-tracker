name: Refresh Stock Dashboard

on:
  workflow_dispatch:
  schedule:
    # Taiwan market pre-open: 08:30 Asia/Taipei, weekdays.
    - cron: "30 0 * * 1-5"
    # Taiwan regular session: every 5 minutes from 09:00 to 13:55 Asia/Taipei, weekdays.
    # The script below runs full_market only on 15-minute marks.
    - cron: "*/5 1-5 * * 1-5"
    # Taiwan post-close verification: 14:15 and 15:00 Asia/Taipei, weekdays.
    - cron: "15 6 * * 1-5"
    - cron: "0 7 * * 1-5"

concurrency:
  group: stock-dashboard-refresh
  cancel-in-progress: false

jobs:
  layered-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_URL: ${{ vars.STOCK_DASHBOARD_URL || 'https://stock.letslepai.com' }}
    steps:
      - name: Trigger layered Render refresh
        run: |
          set -uo pipefail
          minute="$(date -u +%M)"
          hour="$(date -u +%H)"
          failures=0

          call_endpoint() {
            endpoint="$1"
            echo "Calling ${DASHBOARD_URL}${endpoint}"
            if curl --fail --show-error --silent --max-time 240 \
              -X POST \
              -H "X-Requested-With: fetch" \
              -H "Accept: application/json" \
              "${DASHBOARD_URL}${endpoint}"; then
              echo
              echo "OK ${endpoint}"
            else
              echo
              echo "FAILED ${endpoint}"
              failures=$((failures + 1))
            fi
          }

          print_refresh_status() {
            echo
            echo "Refresh status snapshot"
            if curl --fail --show-error --silent --max-time 30 \
              "${DASHBOARD_URL}/api/refresh/status" > refresh-status.json; then
              python3 -m json.tool refresh-status.json
              if python3 - <<'PY'
          import json
          import sys

          payload = json.load(open("refresh-status.json", encoding="utf-8"))
          health = payload.get("operational_health") or {}
          status = health.get("status") or "missing"
          summary = health.get("summary") or "-"
          next_action = (health.get("next_action") or {}).get("label") or "-"
          blockers = health.get("blockers") or []
          warnings = health.get("warnings") or []
          print()
          print(f"Operational health: {status}")
          print(f"Summary: {summary}")
          print(f"Next action: {next_action}")
          if blockers:
              print("Blockers:")
              for item in blockers:
                  print(f"- {item}")
          if warnings:
              print("Warnings:")
              for item in warnings:
                  print(f"- {item}")
          if status == "blocked":
              sys.exit(2)
          if status not in {"ok", "warning"}:
              sys.exit(3)
          PY
              then
                echo "OK /api/refresh/status"
              else
                echo "FAILED /api/refresh/status operational health"
                failures=$((failures + 1))
              fi
            else
              echo "FAILED /api/refresh/status"
              failures=$((failures + 1))
            fi
          }

          # Post-close verification windows.
          if [ "$hour" = "06" ] || [ "$hour" = "07" ]; then
            call_endpoint "/refresh_full_market"
            call_endpoint "/refresh_post_close_validation"
            print_refresh_status
            exit "$failures"
          fi

          # 08:30 pre-open and 15-minute marks during regular session.
          if [ "$hour" = "00" ] || [ "$minute" = "00" ] || [ "$minute" = "15" ] || [ "$minute" = "30" ] || [ "$minute" = "45" ]; then
            call_endpoint "/refresh_full_market"
          fi

          # Lightweight layers for regular-session tracking.
          call_endpoint "/refresh_watchlist"
          call_endpoint "/refresh_positions"
          print_refresh_status
          exit "$failures"
