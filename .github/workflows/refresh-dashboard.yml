name: Refresh Stock Dashboard

on:
  workflow_dispatch:
  schedule:
    # Taiwan market pre-open: 08:30 Asia/Taipei, weekdays.
    - cron: "30 0 * * 1-5"
    # Taiwan regular session: every 15 minutes from 09:00 to 13:45 Asia/Taipei, weekdays.
    - cron: "0,15,30,45 1-5 * * 1-5"
    # Taiwan post-close verification: 14:15 and 15:00 Asia/Taipei, weekdays.
    - cron: "15 6 * * 1-5"
    - cron: "0 7 * * 1-5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render dashboard refresh
        run: |
          curl --fail --show-error --silent --max-time 240 \
            -X POST \
            https://ai-stock-daytrade-tracker.onrender.com/refresh
