name: Refresh Stock Dashboard

on:
  workflow_dispatch:
    inputs:
      refresh_layer:
        description: "Manual refresh layer: auto, full_market, watchlist, positions, post_close, all"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full_market
          - watchlist
          - positions
          - post_close
          - all
  schedule:
    # Taiwan market pre-open: 07:00, 07:30, 08:00 and 08:30 Asia/Taipei, weekdays.
    # 07:00/07:30 TPE are 23:00/23:30 UTC on the previous calendar day.
    - cron: "0,30 23 * * 0-4"
    - cron: "0,30 0 * * 1-5"
    # Taiwan regular session: every 5 minutes from 09:00 to 13:30 Asia/Taipei, weekdays.
    # The script below runs full_market only on 15-minute marks.
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0-30/5 5 * * 1-5"
    # Taiwan post-close verification: 13:45, 14:00, 14:15, 14:30 and 15:00 Asia/Taipei, weekdays.
    - cron: "45 5 * * 1-5"
    - cron: "0,15,30 6 * * 1-5"
    - cron: "0 7 * * 1-5"

concurrency:
  group: stock-dashboard-refresh
  cancel-in-progress: false

jobs:
  layered-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_URL: ${{ vars.STOCK_DASHBOARD_URL || 'https://stock.letslepai.com' }}
      REFRESH_LAYER: ${{ github.event.inputs.refresh_layer || 'auto' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger layered Render refresh
        run: |
          set -uo pipefail
          minute="$(TZ=Asia/Taipei date +%M)"
          hour="$(TZ=Asia/Taipei date +%H)"
          minute_number=$((10#$minute))
          hour_number=$((10#$hour))
          refresh_layer="${REFRESH_LAYER:-auto}"
          failures=0

          call_endpoint() {
            endpoint="$1"
            echo "Calling ${DASHBOARD_URL}${endpoint}"
            if curl --fail --show-error --silent --max-time 240 \
              -X POST \
              -H "X-Requested-With: fetch" \
              -H "Accept: application/json" \
              "${DASHBOARD_URL}${endpoint}"; then
              echo
              echo "OK ${endpoint}"
            else
              echo
              echo "FAILED ${endpoint}"
              failures=$((failures + 1))
            fi
          }

          print_refresh_status() {
            echo
            echo "Refresh status snapshot"
            if curl --fail --show-error --silent --max-time 30 \
              "${DASHBOARD_URL}/api/refresh/status" > refresh-status.json; then
              python3 -m json.tool refresh-status.json
              if python3 scripts/check_operational_health.py --base-url "$DASHBOARD_URL" --timeout 30; then
                echo "OK /api/refresh/status"
              else
                echo "FAILED /api/refresh/status operational health"
                failures=$((failures + 1))
              fi
            else
              echo "FAILED /api/refresh/status"
              failures=$((failures + 1))
            fi
          }

          if [ "$refresh_layer" != "auto" ]; then
            case "$refresh_layer" in
              full_market)
                call_endpoint "/refresh_full_market"
                ;;
              watchlist)
                call_endpoint "/refresh_watchlist"
                ;;
              positions)
                call_endpoint "/refresh_positions"
                ;;
              post_close)
                call_endpoint "/refresh_post_close_validation"
                ;;
              all)
                call_endpoint "/refresh_full_market"
                call_endpoint "/refresh_watchlist"
                call_endpoint "/refresh_positions"
                call_endpoint "/refresh_post_close_validation"
                ;;
              *)
                echo "Unknown refresh_layer: ${refresh_layer}"
                failures=$((failures + 1))
                ;;
            esac
            print_refresh_status
            exit "$failures"
          fi

          # Post-close verification windows: 13:45-15:00 Asia/Taipei.
          if { [ "$hour_number" -eq 13 ] && [ "$minute_number" -eq 45 ]; } || [ "$hour_number" -eq 14 ] || { [ "$hour_number" -eq 15 ] && [ "$minute_number" -eq 0 ]; }; then
            call_endpoint "/refresh_full_market"
            call_endpoint "/refresh_post_close_validation"
            print_refresh_status
            exit "$failures"
          fi

          # Pre-open and 15-minute marks during regular session.
          if { [ "$hour_number" -ge 7 ] && [ "$hour_number" -lt 9 ]; } || [ "$minute_number" -eq 0 ] || [ "$minute_number" -eq 15 ] || [ "$minute_number" -eq 30 ] || [ "$minute_number" -eq 45 ]; then
            call_endpoint "/refresh_full_market"
          fi

          # Lightweight layers for regular-session tracking.
          call_endpoint "/refresh_watchlist"
          call_endpoint "/refresh_positions"
          print_refresh_status
          exit "$failures"
